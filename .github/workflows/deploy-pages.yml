name: Deploy to GitHub Pages

# Serves the self-contained tracker (index.html) + resources page on GitHub Pages.
# Rebuilds index.html from source so the published site never goes stale.
#
# ONE-TIME SETUP (repo owner): Settings -> Pages -> Build and deployment ->
#   Source: "GitHub Actions". After that, every push to main auto-deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild index.html from source
        run: python3 build_web.py

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html resources.html _site/
          cp -r screenshots _site/screenshots
          touch _site/.nojekyll   # serve files as-is; skip Jekyll processing

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
